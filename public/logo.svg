<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#0d7377"/>
      <stop offset="100%" stop-color="#2e8b57"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#68d391"/>
      <stop offset="100%" stop-color="#2e8b57"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d7377"/>
      <stop offset="100%" stop-color="#2e8b57"/>
    </linearGradient>
  </defs>
  
  <!-- DNA Helix (simplified) -->
  <g transform="translate(10,10)">
    <!-- Left strand -->
    <path d="M20 10 C35 25, 35 45, 20 60 C5 75, 5 95, 20 110" fill="none" stroke="url(#dnaGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Right strand -->
    <path d="M50 10 C35 25, 35 45, 50 60 C65 75, 65 95, 50 110" fill="none" stroke="url(#dnaGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Rungs -->
    <line x1="22" y1="25" x2="48" y2="25" stroke="url(#dnaGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="45" x2="48" y2="45" stroke="url(#dnaGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="65" x2="48" y2="65" stroke="url(#dnaGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="85" x2="48" y2="85" stroke="url(#dnaGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Leaves -->
    <ellipse cx="8" cy="30" rx="12" ry="7" fill="url(#leafGrad)" transform="rotate(-30 8 30)"/>
    <ellipse cx="8" cy="55" rx="12" ry="7" fill="url(#leafGrad)" transform="rotate(-20 8 55)"/>
    <ellipse cx="8" cy="80" rx="12" ry="7" fill="url(#leafGrad)" transform="rotate(-10 8 80)"/>
  </g>
  
  <!-- Text -->
  <text x="90" y="58" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="url(#textGrad)">Biobuilt</text>
  <text x="95" y="90" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#0d7377">SCIENCES</text>
</svg>
